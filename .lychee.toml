# Local routes are checked against the built site by scripts/check-site.py.
# Remote project URLs point to production, not an unmerged preview.
exclude_path = ['(^|/)(node_modules|vendor|tmp)/', '_site/assets/']
exclude = ['^mailto:', '^http://localhost', '^http://127\.0\.0\.1', '^https?://0\.0\.0\.0', '^https://amdowning\.github\.io/healthcare-llm-threat-model']
max_concurrency = 10
timeout = 20
max_retries = 2
accept = ['200..=204', '206', '301', '302', '303', '307', '308']
user_agent = 'lychee-ci'
