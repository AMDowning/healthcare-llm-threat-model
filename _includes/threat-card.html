<article class="catalog-card">
  <p class="eyebrow">{{ include.kind | capitalize }}</p>
  <h2><a href="{{ include.url | relative_url }}">{{ include.title | escape }}</a></h2>
  <p>{{ include.summary | escape }}</p>
  <p class="meta">{% if include.updated %}Reviewed/updated {{ include.updated }}{% else %}Historical research summary{% endif %}</p>
  <ul class="tag-list">{% for tag in include.tags %}<li>{{ tag | escape }}</li>{% endfor %}</ul>
</article>
